volumes:
  kestra_pgdata:
  kestra:
    
services:
  kestra_postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: kestra
    ports:
      - 5432:5432
    volumes:
      - kestra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    
  kestra:
    image: kestra/kestra:v1.1
    pull_policy: always
    user: root
    command: server standalone
    volumes:
      - kestra:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    env_file:
      - ./.env_encoded # TODO set path to your environment file with SECRET_GCP_KEY (your GCP Service Account key)
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: root
            password: root
        kestra:
          server:
            basicAuth:
              enabled: false
              username: admin@kestra.io
              password: Admin1234
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - 8080:8080
      - 8081:8081
    depends_on:
      kestra_postgres:
        condition: service_healthy
